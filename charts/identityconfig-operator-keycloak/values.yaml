deployment:
  operatorName: identityconfig-operator-keycloak
  idkopImage: tmforumodacanvas/identityconfig-operator-keycloak
  idkopVersion: 1.1.0
  idkopPrereleaseSuffix: 
  imagePullPolicy: IfNotPresent
  istioGateway: true
  idlistkeyImage: tmforumodacanvas/identity-listener-keycloak
  idlistkeyVersion: 1.1.0
  idlistkeyPrereleaseSuffix: 
  monitoredNamespaces: 'components'           # comma separated list of namespaces
  ingressClass:
    enabled: false
    name: nginx
  dataDog:
    enabled: false
  keycloak:
    port: 8080
  hostName: "*"
  httpsRedirect: true
  credentialName: istio-ingress-cert    
# Keycloak Admin API credentials for the identity operator / listener.
# authType:
#   password (default) — user/pass = admin username/password via admin-cli
#   clientCredentials  — user/pass = confidential client id / client secret
credentials:
  authType: password
  user: admin
  pass: adpass
  # Realm that issues the Admin API token (usually master)
  tokenRealm: master
configmap:
  #kcbase: http://canvas-keycloak:8088/auth # trying to parameterise this in the configmap
  kcrealm: odari
  loglevel: '20'
